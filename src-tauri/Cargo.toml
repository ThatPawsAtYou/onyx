[package]
name = "onyx"
version = "1.1.0"
description = "Onyx — High-performance disk space analyzer, storage diff & system cleaner"
authors = ["ThatPawsAtYou"]
license = "MIT"
repository = "https://github.com/ThatPawsAtYou/onyx"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "onyx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["disk", "system"] }
jwalk = "0.8"
rayon = "1.10"
walkdir = "2.5"
sha2 = "0.10"

[target.'cfg(not(windows))'.dependencies]
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[profile.release]
panic = "abort"
codegen-units = 16
lto = false
opt-level = "s"
strip = true
debug = false

[profile.release.package.sha2]
opt-level = 3

[profile.release.package.jwalk]
opt-level = 3

[profile.release.package.walkdir]
opt-level = 3

[profile.release.package.rayon]
opt-level = 3
